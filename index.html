<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050307">
  <meta name="description" content="WINE AI — More Than An AI. الموقع تحت التطوير.">
  <title>WINE AI | قريباً</title>
  <style>
    :root {
      color-scheme: dark;
      --purple: #a855f7;
      --violet: #7625d8;
      --silver: #e7e4ed;
      --muted: #aaa3b5;
      --green: #39e879;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; min-height: 100%; background: #050307; }
    body {
      min-height: 100vh;
      min-height: 100svh;
      overflow: hidden;
      color: var(--silver);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .page {
      position: relative;
      isolation: isolate;
      display: grid;
      place-items: center;
      width: 100%;
      min-height: 100vh;
      min-height: 100svh;
      padding: max(26px, env(safe-area-inset-top)) 22px max(30px, env(safe-area-inset-bottom));
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 36%, rgba(113, 37, 191, .19), transparent 39%),
        radial-gradient(ellipse at 0% 100%, rgba(100, 20, 180, .16), transparent 35%),
        #050307;
    }
    .ambient {
      position: absolute;
      z-index: -1;
      width: 75vw;
      height: 75vw;
      max-width: 650px;
      max-height: 650px;
      border: 1px solid rgba(168, 85, 247, .12);
      border-radius: 50%;
      filter: blur(.2px);
      animation: orbit 22s linear infinite;
    }
    .ambient::before, .ambient::after {
      content: "";
      position: absolute;
      inset: 9%;
      border: 1px solid rgba(168, 85, 247, .09);
      border-radius: 44% 56% 63% 37%;
      transform: rotate(35deg);
    }
    .ambient::after { inset: 19%; transform: rotate(-28deg); }
    .glow {
      position: absolute;
      z-index: -1;
      width: 230px;
      height: 230px;
      border-radius: 50%;
      background: rgba(129, 46, 214, .18);
      filter: blur(85px);
      animation: breathe 5s ease-in-out infinite alternate;
    }
    .content {
      width: min(100%, 560px);
      text-align: center;
      animation: enter 1.1s ease both;
    }
    .brand-mark {
      position: relative;
      display: grid;
      place-items: center;
      width: 142px;
      height: 142px;
      margin: 0 auto 24px;
      border: 1px solid rgba(193, 157, 255, .35);
      border-radius: 38px;
      background: linear-gradient(145deg, rgba(255,255,255,.10), rgba(104,35,170,.10) 55%, rgba(0,0,0,.5));
      box-shadow: 0 0 55px rgba(145, 54, 239, .18), inset 0 0 30px rgba(174, 113, 255, .08);
      transform: rotate(-5deg);
    }
    .brand-mark::before {
      content: "";
      position: absolute;
      width: 164px;
      height: 48px;
      border: 5px solid var(--purple);
      border-left-color: transparent;
      border-right-color: transparent;
      border-radius: 50%;
      transform: rotate(-19deg);
      filter: drop-shadow(0 0 9px rgba(168,85,247,.8));
      animation: ring 7s ease-in-out infinite;
    }
    .brand-w {
      direction: ltr;
      font-size: 91px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: -12px;
      padding-right: 11px;
      color: transparent;
      background: linear-gradient(145deg, #fff 12%, #aaa5b5 48%, #f5f1ff 68%, #77717f);
      -webkit-background-clip: text;
      background-clip: text;
      text-shadow: 0 8px 30px rgba(255,255,255,.12);
      transform: rotate(5deg);
    }
    h1 {
      direction: ltr;
      margin: 0;
      font-size: clamp(42px, 11vw, 66px);
      line-height: 1.08;
      letter-spacing: .035em;
      font-weight: 850;
      color: var(--silver);
      text-shadow: 0 0 28px rgba(180, 140, 255, .16);
    }
    h1 span {
      color: var(--purple);
      text-shadow: 0 0 24px rgba(168,85,247,.5);
    }
    .tagline {
      direction: ltr;
      margin: 13px 0 42px;
      color: #bcb5c7;
      font-size: 12px;
      letter-spacing: .42em;
      font-weight: 500;
    }
    .hourglass {
      position: relative;
      width: 42px;
      height: 54px;
      margin: 0 auto 24px;
      border-top: 4px solid var(--purple);
      border-bottom: 4px solid var(--purple);
      filter: drop-shadow(0 0 9px rgba(168,85,247,.7));
    }
    .hourglass::before {
      content: "";
      position: absolute;
      inset: 2px 3px;
      background: linear-gradient(135deg, transparent 48%, var(--purple) 49% 53%, transparent 54%),
                  linear-gradient(45deg, transparent 48%, var(--purple) 49% 53%, transparent 54%);
      clip-path: polygon(0 0,100% 0,58% 50%,100% 100%,0 100%,42% 50%);
      animation: sand 2.8s ease-in-out infinite;
    }
    h2 {
      margin: 0 0 17px;
      font-size: clamp(27px, 7vw, 39px);
      font-weight: 850;
      line-height: 1.5;
    }
    h2 span { color: var(--purple); }
    .description {
      margin: 0 auto;
      max-width: 440px;
      color: #c9c4d0;
      font-size: clamp(15px, 4vw, 18px);
      line-height: 2;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 34px;
      padding: 11px 22px;
      border: 1px solid rgba(168,85,247,.58);
      border-radius: 999px;
      color: #d9b7ff;
      background: rgba(93, 35, 143, .12);
      box-shadow: 0 0 25px rgba(143, 53, 222, .12), inset 0 0 18px rgba(143,53,222,.06);
      font-size: 15px;
      font-weight: 650;
    }
    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green), 0 0 17px rgba(57,232,121,.55);
      animation: blink 1.15s ease-in-out infinite;
    }
    footer {
      margin-top: 42px;
      color: #a9a1b2;
      font-size: 11px;
      letter-spacing: .22em;
      direction: ltr;
    }
    footer b { color: var(--purple); }
    .spark {
      position: absolute;
      top: 15%;
      right: 15%;
      width: 7px;
      height: 7px;
      background: #d9b7ff;
      transform: rotate(45deg);
      box-shadow: 0 0 18px 5px rgba(168,85,247,.65);
      animation: twinkle 2.4s ease-in-out infinite;
    }
    @keyframes blink { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.2;transform:scale(.75)} }
    @keyframes breathe { from{transform:scale(.8);opacity:.45} to{transform:scale(1.2);opacity:.85} }
    @keyframes orbit { to{transform:rotate(360deg)} }
    @keyframes ring { 0%,100%{transform:rotate(-19deg) scaleX(1)} 50%{transform:rotate(-10deg) scaleX(.92)} }
    @keyframes sand { 0%,100%{opacity:.65;transform:scaleY(1)} 50%{opacity:1;transform:scaleY(.82)} }
    @keyframes twinkle { 0%,100%{opacity:.35;scale:.7} 50%{opacity:1;scale:1.2} }
    @keyframes enter { from{opacity:0;transform:translateY(18px)} to{opacity:1;transform:translateY(0)} }
    @media (max-height: 700px) {
      .brand-mark { width: 105px; height: 105px; margin-bottom: 16px; border-radius: 30px; }
      .brand-w { font-size: 68px; }
      .brand-mark::before { width: 125px; height: 38px; }
      .tagline { margin-bottom: 24px; }
      .hourglass { margin-bottom: 15px; }
      .status { margin-top: 22px; }
      footer { margin-top: 25px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *,*::before,*::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="ambient" aria-hidden="true"></div>
    <div class="glow" aria-hidden="true"></div>
    <div class="spark" aria-hidden="true"></div>
    <section class="content">
      <div class="brand-mark" aria-label="WINE logo"><span class="brand-w">W</span></div>
      <h1>WINE <span>AI</span></h1>
      <p class="tagline">MORE THAN AN AI</p>
      <div class="hourglass" aria-hidden="true"></div>
      <h2>الموقع <span>تحت التطوير</span></h2>
      <p class="description">
        نعمل على تجهيز WINE AI ليكون جاهزًا للاستخدام.
        <br>
        تجربة جديدة من WINE... قريبًا.
      </p>
      <div class="status"><span class="dot" aria-hidden="true"></span>قيد التطوير</div>
      <footer>WINE AI <b>•</b> POWERED BY WINE</footer>
    </section>
  </main>
</body>
</html>
