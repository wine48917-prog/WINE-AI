<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050307">
  <meta name="description" content="WINE AI — More Than An AI. الموقع تحت التطوير.">
  <title>WINE AI | الموقع تحت التطوير</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #050307;
    }
    body {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }
    main {
      width: 100%;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .poster {
      display: block;
      width: 100%;
      height: auto;
      max-height: 100svh;
      object-fit: contain;
    }
    @media (min-width: 700px) {
      .poster {
        width: auto;
        height: 100svh;
        max-width: 100%;
      }
    }
  </style>
</head>
<body>
  <main>
    <img
      class="poster"
      src="/wine-ai.png"
      alt="WINE AI — الموقع تحت التطوير"
    >
  </main>
</body>
</html>
