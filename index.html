<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#08070d">
  <meta name="description" content="WINE AI — المستقبل يبدأ هنا. تجربة ذكاء اصطناعي جديدة من WINE.">
  <title>WINE AI — Coming Soon</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Orbitron:wght@500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>
  <div class="grid-glow"></div>

  <main class="screen">
    <header class="topbar">
      <a class="wordmark" href="#" aria-label="WINE">
        <span class="wordmark-mark">W</span>
        <span>WINE<span class="wordmark-dot">.</span></span>
      </a>
      <div class="status"><span class="status-dot"></span><span>نستعد للإطلاق</span></div>
    </header>

    <section class="hero" aria-labelledby="main-title">
      <div class="orb-wrap" aria-label="رمز ذكاء اصطناعي متحرك">
        <div class="orb-halo"></div>
        <div class="orb-ring ring-a"></div>
        <div class="orb-ring ring-b"></div>
        <div class="orb-ring ring-c"></div>
        <div class="ai-orb">
          <div class="orb-core"></div>
          <span class="orb-node node-one"></span>
          <span class="orb-node node-two"></span>
          <span class="orb-node node-three"></span>
          <span class="orb-node node-four"></span>
          <span class="orb-cross cross-one"></span>
          <span class="orb-cross cross-two"></span>
          <span class="orb-cross cross-three"></span>
          <span class="orb-cross cross-four"></span>
        </div>
        <div class="orbit-particle particle-one"></div>
        <div class="orbit-particle particle-two"></div>
      </div>

      <div class="eyebrow"><span></span> MORE THAN AN AI <span></span></div>
      <h1 id="main-title">WINE <em>AI</em></h1>
      <h2>المستقبل يبدأ هنا</h2>
      <p class="description">
        نحن نصنع تجربة ذكاء اصطناعي مختلفة، تساعدك على التفكير والإبداع
        وكتابة الأكواد وإنجاز المزيد. <strong>استعد لشيء جديد.</strong>
      </p>

      <div class="launch-line">
        <span class="pulse"></span>
        <span>نعمل على تجهيز التجربة</span>
        <span class="separator">•</span>
        <span class="soon">قريبًا</span>
      </div>
    </section>

    <footer class="footer">
      <span>WINE AI</span>
      <span class="footer-divider"></span>
      <span>POWERED BY WINE</span>
    </footer>
  </main>
</body>
</html>
