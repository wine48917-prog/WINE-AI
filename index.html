
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050307">

  <title>WINE AI | قريباً</title>

  <meta name="description"
    content="WINE AI - More Than An AI. الموقع تحت التطوير.">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background: #050307;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .poster {
      display: block;
      width: 100%;
      height: auto;
      max-height: 100svh;
      object-fit: contain;
    }

    @media (min-width: 700px) {
      .poster {
        width: auto;
        height: 100svh;
        max-width: 100%;
      }
    }
  </style>
</head>

<body>

  <main class="container">
    <img
      class="poster"
      src="./wine-ai.png"
      alt="WINE AI - الموقع تحت التطوير"
    >
  </main>

</body>
</html>
